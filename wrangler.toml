name = "annr-final-site"
main = ".output/server/index.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"
binding = "ASSETS"
# Dynamic admin products and custom categories/campaigns are rendered through
# the existing storefront HTML templates via the Worker.
run_worker_first = [
  "/products/*",
  "!/products/annr-archival-001/*",
  "/collections/*",
  "!/collections/unique-campaign/*",
  "!/collections/all/*",
  "!/collections/hoodies/*",
  "!/collections/sweatshirts/*",
  "!/collections/trousers/*",
  "!/collections/sweaters/*",
  "!/collections/t-shirts/*",
  "!/collections/jackets/*",
  "!/collections/knitwear/*",
  "!/collections/accessories/*"
]

[observability]
enabled = true

